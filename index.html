<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>オンライン ito (2人用・2枚ルール)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col justify-center items-center p-4">

  <div class="max-w-md w-full bg-slate-800 p-6 rounded-2xl shadow-xl border border-slate-700">
    <h1 class="text-3xl font-extrabold text-center mb-6 text-amber-400">ito オンライン (2人用)</h1>

    <!-- 接続画面 -->
    <div id="setup-screen" class="space-y-4">
      <button id="btn-create" class="w-full py-3 bg-amber-500 hover:bg-amber-600 font-bold rounded-xl text-slate-900 transition">
        部屋を作成する（ホスト）
      </button>
      
      <div class="relative flex py-2 items-center">
        <div class="flex-grow border-t border-slate-600"></div>
        <span class="flex-shrink mx-4 text-slate-400 text-sm">または</span>
        <div class="flex-grow border-t border-slate-600"></div>
      </div>

      <div class="flex gap-2">
        <input type="text" id="join-id" maxlength="5" placeholder="5桁の部屋コード" class="flex-1 px-4 py-3 bg-slate-700 rounded-xl border border-slate-600 text-white font-mono text-center text-lg focus:outline-none focus:border-amber-400">
        <button id="btn-join" class="px-6 py-3 bg-blue-600 hover:bg-blue-700 font-bold rounded-xl transition">
          参加
        </button>
      </div>

      <div id="my-id-display" class="hidden p-4 bg-slate-700/50 rounded-xl text-center space-y-2">
        <p class="text-xs text-slate-400">あなたの部屋コード（相手に教えてください）</p>
        <p id="peer-id" class="text-4xl font-mono font-black text-amber-400 tracking-wider select-all"></p>
        <p id="status-msg" class="text-sm text-amber-300">相手の接続を待っています...</p>
      </div>
    </div>

    <!-- ゲーム画面 -->
    <div id="game-screen" class="hidden space-y-6">
      <div id="theme-box" class="p-4 bg-amber-500/10 border border-amber-500/30 rounded-xl text-center">
        <p class="text-xs text-amber-400 font-bold">今回のお題</p>
        <p id="theme-text" class="text-xl font-bold mt-1">「ゲーム開始」を押してください</p>
      </div>

      <div class="space-y-2">
        <p class="text-xs text-slate-400 font-bold">あなたの手札（タップして場に出す）</p>
        <div id="hand-cards" class="grid grid-cols-2 gap-3"></div>
      </div>

      <div class="space-y-2">
        <p class="text-xs text-slate-400 font-bold">場に出されたカード (裏向きで蓄積・4枚で一斉オープン)</p>
        <div id="field-cards" class="min-h-[90px] p-3 bg-slate-950/50 rounded-xl flex flex-wrap gap-2 items-center justify-center border border-slate-700">
          <span class="text-slate-500 text-sm">まだカードは出されていません</span>
        </div>
      </div>

      <div id="result-box" class="hidden p-4 rounded-xl text-center font-bold text-lg"></div>

      <div class="pt-2">
        <button id="btn-start" class="w-full py-3 bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold rounded-xl transition">
          新しいテーマでカードを配る
        </button>
      </div>
    </div>
  </div>

  <script>
    const themes = ["食べ物の好き嫌い", "無人島に持っていきたいもの", "強そうな特技", "人気のある動物", "言われて嬉しい言葉", "ゾンビ世界で生き残りそうな行動", "理想のデートスポット"];
    
    let peer = null;
    let conn = null;
    let myHand = [];
    let field = [];
    let isHost = false;
    let isRevealed = false;

    const setupScreen = document.getElementById('setup-screen');
    const gameScreen = document.getElementById('game-screen');
    const btnCreate = document.getElementById('btn-create');
    const btnJoin = document.getElementById('btn-join');
    const joinInput = document.getElementById('join-id');
    const myIdDisplay = document.getElementById('my-id-display');
    const peerIdText = document.getElementById('peer-id');
    const btnStart = document.getElementById('btn-start');

    // 5桁のランダムな数字IDを生成
    function generateShortCode() {
      return Math.floor(10000 + Math.random() * 90000).toString();
    }

    // 部屋作成（ホスト）
    btnCreate.addEventListener('click', () => {
      isHost = true;
      btnCreate.disabled = true;
      btnCreate.textContent = "部屋を作成中...";

      const shortId = "ito-" + generateShortCode();
      peer = new Peer(shortId);

      peer.on('open', (id) => {
        const displayCode = id.replace('ito-', '');
        myIdDisplay.classList.remove('hidden');
        peerIdText.textContent = displayCode;
        btnCreate.textContent = "部屋を作成済み";
      });

      peer.on('error', (err) => {
        if (err.type === 'unavailable-id') {
          // もし奇跡的に5桁IDが重複した場合は再試行
          btnCreate.click();
        } else {
          alert("接続エラー: " + err.type);
          btnCreate.disabled = false;
          btnCreate.textContent = "部屋を作成する（ホスト）";
        }
      });

      peer.on('connection', (c) => {
        conn = c;
        setupConnection();
      });
    });

    // 参加（ゲスト）
    btnJoin.addEventListener('click', () => {
      const code = joinInput.value.trim();
      if (!code || code.length !== 5) return alert('5桁の部屋コードを入力してください');
      
      isHost = false;
      btnJoin.disabled = true;
      btnJoin.textContent = "接続中...";

      const targetId = "ito-" + code;
      peer = new Peer();

      peer.on('open', () => {
        conn = peer.connect(targetId);
        setupConnection();
      });

      peer.on('error', (err) => {
        alert("部屋が見つかりません。5桁のコードを確認してください。");
        btnJoin.disabled = false;
        btnJoin.textContent = "参加";
      });
    });

    // 通信確立後の処理
    function setupConnection() {
      conn.on('open', () => {
        setupScreen.classList.add('hidden');
        gameScreen.classList.remove('hidden');
        if (!isHost) btnStart.classList.add('hidden');
      });

      conn.on('data', (data) => {
        handleData(data);
      });
    }

    // ゲーム開始（ホストのみ）
    btnStart.addEventListener('click', () => {
      if (!isHost) return;
      
      const theme = themes[Math.floor(Math.random() * themes.length)];
      
      const nums = [];
      while(nums.length < 4) {
        const r = Math.floor(Math.random() * 100) + 1;
        if(!nums.includes(r)) nums.push(r);
      }

      const hostHand = [nums[0], nums[1]];
      const guestHand = [nums[2], nums[3]];

      conn.send({ type: 'START', theme: theme, hand: guestHand });
      startNewGame(theme, hostHand);
    });

    function startNewGame(theme, hand) {
      myHand = hand;
      field = [];
      isRevealed = false;
      document.getElementById('theme-text').textContent = theme;
      document.getElementById('result-box').classList.add('hidden');
      renderHand();
      renderField();
    }

    // 手札描画
    function renderHand() {
      const container = document.getElementById('hand-cards');
      container.innerHTML = '';
      
      myHand.forEach((num) => {
        const btn = document.createElement('button');
        btn.className = 'py-6 bg-amber-500 hover:bg-amber-400 font-black text-2xl text-slate-900 rounded-xl shadow-lg transition active:scale-95';
        btn.textContent = num;
        btn.onclick = () => playCard(num);
        container.appendChild(btn);
      });
    }

    // カードを出す（裏向き）
    function playCard(num) {
      if (isRevealed) return;
      myHand = myHand.filter(n => n !== num);
      
      field.push({ num: num, opened: false });
      renderHand();
      renderField();

      conn.send({ type: 'PLAY_CARD', num: num });
      checkAllPlayed();
    }

    // 場描画
    function renderField() {
      const container = document.getElementById('field-cards');
      container.innerHTML = '';

      if (field.length === 0) {
        container.innerHTML = '<span class="text-slate-500 text-sm">まだカードは出されていません</span>';
        return;
      }

      field.forEach((card) => {
        const div = document.createElement('div');
        if (card.opened) {
          div.className = 'w-14 h-18 py-3 bg-amber-400 text-slate-900 border border-amber-200 font-bold text-xl rounded-lg flex items-center justify-center shadow animate-bounce';
          div.textContent = card.num;
        } else {
          div.className = 'w-14 h-18 py-3 bg-slate-700 text-slate-400 border border-slate-600 font-bold text-xl rounded-lg flex items-center justify-center shadow';
          div.textContent = '？';
        }
        container.appendChild(div);
      });
    }

    // 4枚揃ったら一斉オープン＆判定
    function checkAllPlayed() {
      if (field.length === 4 && !isRevealed) {
        isRevealed = true;
        
        field.forEach(c => c.opened = true);
        renderField();

        const nums = field.map(c => c.num);
        const isSuccess = nums.every((val, i, arr) => !i || arr[i - 1] <= val);

        const resultBox = document.getElementById('result-box');
        resultBox.classList.remove('hidden');

        if (isSuccess) {
          resultBox.className = 'p-4 rounded-xl text-center font-bold text-lg bg-emerald-500/20 text-emerald-300 border border-emerald-500/30';
          resultBox.textContent = '🎉 成功！完全な順番で出せました！';
        } else {
          resultBox.className = 'p-4 rounded-xl text-center font-bold text-lg bg-rose-500/20 text-rose-300 border border-rose-500/30';
          resultBox.textContent = '💥 失敗... 順番が違いました！';
        }
      }
    }

    // 受信処理
    function handleData(data) {
      if (data.type === 'START') {
        startNewGame(data.theme, data.hand);
      } else if (data.type === 'PLAY_CARD') {
        field.push({ num: data.num, opened: false });
        renderField();
        checkAllPlayed();
      }
    }
  </script>
</body>
</html>
