<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>オンライン ito (2人用・2枚ルール)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col justify-center items-center p-4">

  <div class="max-w-md w-full bg-slate-800 p-6 rounded-2xl shadow-xl border border-slate-700">
    <h1 class="text-3xl font-extrabold text-center mb-6 text-amber-400">ito オンライン (2人用)</h1>

    <!-- 接続画面 -->
    <div id="setup-screen" class="space-y-4">
      <button id="btn-create" class="w-full py-3 bg-amber-500 hover:bg-amber-600 font-bold rounded-xl text-slate-900 transition">
        部屋を作成する（ホスト）
      </button>
      
      <div class="relative flex py-2 items-center">
        <div class="flex-grow border-t border-slate-600"></div>
        <span class="flex-shrink mx-4 text-slate-400 text-sm">または</span>
        <div class="flex-grow border-t border-slate-600"></div>
      </div>

      <div class="flex gap-2">
        <input type="text" id="join-id" placeholder="相手のIDを入力" class="flex-1 px-4 py-3 bg-slate-700 rounded-xl border border-slate-600 text-white focus:outline-none focus:border-amber-400">
        <button id="btn-join" class="px-6 py-3 bg-blue-600 hover:bg-blue-700 font-bold rounded-xl transition">
          参加
        </button>
      </div>

      <div id="my-id-display" class="hidden p-4 bg-slate-700/50 rounded-xl text-center space-y-2">
        <p class="text-xs text-slate-400">あなたの部屋ID（相手に伝えてください）</p>
        <p id="peer-id" class="text-2xl font-mono font-bold text-amber-400 select-all"></p>
        <p id="status-msg" class="text-sm text-amber-300">相手の接続を待っています...</p>
      </div>
    </div>

    <!-- ゲーム画面 -->
    <div id="game-screen" class="hidden space-y-6">
      <div id="theme-box" class="p-4 bg-amber-500/10 border border-amber-500/30 rounded-xl text-center">
        <p class="text-xs text-amber-400 font-bold">今回のお題</p>
        <p id="theme-text" class="text-xl font-bold mt-1">「ゲーム開始」を押してください</p>
      </div>

      <div class="space-y-2">
        <p class="text-xs text-slate-400 font-bold">あなたの手札（2枚）</p>
        <div id="hand-cards" class="grid grid-cols-2 gap-3"></div>
      </div>

      <div class="space-y-2">
        <p class="text-xs text-slate-400 font-bold">場に出されたカード (最大4枚)</p>
        <div id="field-cards" class="min-h-[90px] p-3 bg-slate-950/50 rounded-xl flex flex-wrap gap-2 items-center justify-center border border-slate-700">
          <span class="text-slate-500 text-sm">まだカードは出されていません</span>
        </div>
      </div>

      <div id="result-box" class="hidden p-4 rounded-xl text-center font-bold text-lg"></div>

      <div class="pt-2">
        <button id="btn-start" class="w-full py-3 bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold rounded-xl transition">
          新しいテーマでカードを配る
        </button>
      </div>
    </div>
  </div>

  <script>
    const themes = ["食べ物の好き嫌い", "無人島に持っていきたいもの", "強そうな特技・特技", "人気のある動物", "言われて嬉しい言葉", "ゾンビ世界で生き残りそうな行動", "理想のデートスポット"];
    
    let peer = null;
    let conn = null;
    let myHand = [];
    let field = [];
    let isHost = false;

    const setupScreen = document.getElementById('setup-screen');
    const gameScreen = document.getElementById('game-screen');
    const btnCreate = document.getElementById('btn-create');
    const btnJoin = document.getElementById('btn-join');
    const joinInput = document.getElementById('join-id');
    const myIdDisplay = document.getElementById('my-id-display');
    const peerIdText = document.getElementById('peer-id');
    const statusMsg = document.getElementById('status-msg');
    const btnStart = document.getElementById('btn-start');

    // 部屋作成（ホスト）
    btnCreate.addEventListener('click', () => {
      isHost = true;
      peer = new Peer();
      btnCreate.disabled = true;
      
      peer.on('open', (id) => {
        myIdDisplay.classList.remove('hidden');
        peerIdText.textContent = id;
      });

      peer.on('connection', (c) => {
        conn = c;
        setupConnection();
      });
    });

    // 参加（ゲスト）
    btnJoin.addEventListener('click', () => {
      const targetId = joinInput.value.trim();
      if (!targetId) return alert('IDを入力してください');
      
      isHost = false;
      peer = new Peer();
      
      peer.on('open', () => {
        conn = peer.connect(targetId);
        setupConnection();
      });
    });

    // 通信確立後の処理
    function setupConnection() {
      conn.on('open', () => {
        setupScreen.classList.add('hidden');
        gameScreen.classList.remove('hidden');
        if (!isHost) btnStart.classList.add('hidden');
      });

      conn.on('data', (data) => {
        handleData(data);
      });
    }

    // ゲーム開始（ホストのみ）
    btnStart.addEventListener('click', () => {
      if (!isHost) return;
      
      const theme = themes[Math.floor(Math.random() * themes.length)];
      
      // 1〜100から重複なしで4枚選ぶ
      const nums = [];
      while(nums.length < 4) {
        const r = Math.floor(Math.random() * 100) + 1;
        if(!nums.includes(r)) nums.push(r);
      }

      const hostHand = [nums[0], nums[1]];
      const guestHand = [nums[2], nums[3]];

      // 相手に手札とお題を送る
      conn.send({ type: 'START', theme: theme, hand: guestHand });

      // 自分の手札をセット
      startNewGame(theme, hostHand);
    });

    function startNewGame(theme, hand) {
      myHand = hand;
      field = [];
      document.getElementById('theme-text').textContent = theme;
      document.getElementById('result-box').classList.add('hidden');
      renderHand();
      renderField();
    }

    // 手札描画
    function renderHand() {
      const container = document.getElementById('hand-cards');
      container.innerHTML = '';
      
      myHand.forEach((num) => {
        const btn = document.createElement('button');
        btn.className = 'py-6 bg-amber-500 hover:bg-amber-400 font-black text-2xl text-slate-900 rounded-xl shadow-lg transition active:scale-95';
        btn.textContent = num;
        btn.onclick = () => playCard(num);
        container.appendChild(btn);
      });
    }

    // カードを出す
    function playCard(num) {
      myHand = myHand.filter(n => n !== num);
      field.push(num);
      renderHand();
      renderField();

      conn.send({ type: 'PLAY_CARD', num: num });
      checkResult();
    }

    // 場描画
    function renderField() {
      const container = document.getElementById('field-cards');
      container.innerHTML = '';

      if (field.length === 0) {
        container.innerHTML = '<span class="text-slate-500 text-sm">まだカードは出されていません</span>';
        return;
      }

      field.forEach((num) => {
        const div = document.createElement('div');
        div.className = 'w-14 h-18 py-3 bg-slate-700 text-amber-400 border border-amber-400 font-bold text-xl rounded-lg flex items-center justify-center shadow';
        div.textContent = num;
        container.appendChild(div);
      });
    }

    // 判定
    function checkResult() {
      if (field.length === 4) {
        const isSuccess = field.every((val, i, arr) => !i || arr[i - 1] <= val);
        const resultBox = document.getElementById('result-box');
        resultBox.classList.remove('hidden');

        if (isSuccess) {
          resultBox.className = 'p-4 rounded-xl text-center font-bold text-lg bg-emerald-500/20 text-emerald-300 border border-emerald-500/30';
          resultBox.textContent = '🎉 成功！完全な順番で出せました！';
        } else {
          resultBox.className = 'p-4 rounded-xl text-center font-bold text-lg bg-rose-500/20 text-rose-300 border border-rose-500/30';
          resultBox.textContent = '💥 失敗... 順番が違いました！';
        }
      }
    }

    // 受信処理
    function handleData(data) {
      if (data.type === 'START') {
        startNewGame(data.theme, data.hand);
      } else if (data.type === 'PLAY_CARD') {
        field.push(data.num);
        renderField();
        checkResult();
      }
    }
  </script>
</body>
</html>
